<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-9</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
    <table border="1">
        <tbody>
            <tr>
                <td>Nome:</td>
                <td>
                    <label for="Nome"></label>
                    <input type="text" id="Nome" name="nome" size="40" maxlength="30" placeholder="Digite seu nome">
                </td>
            </tr>
            <tr>
                <td>E-mail pessoal:</td>
                <td>
                <input type="text" id="E-mail" name="E-mail" size="40" maxlength="30">
                </td>
            </tr>
            <tr>
                <td>E-mail (patter):</td>
                <td>
                <input type="text" id="E-mail" name="E-mail" size="40" maxlength="30" placeholder="Digite seu email com @">
                </td>
            </tr>
            <tr>
                <td>Senha:</td>
                <td>
                    <input type="text" id="Senha" name="Senha" size="40" maxlength="30">
                </td>
            </tr>
            <tr>
                <td>Idade:</td>
                <td>
                    <input type="text" id="Senha" name="Senha" size="5" maxlength="30">
                </td>
            </tr>
            <tr>
                <td colspan="2">Deixe um comentário: <br>
                    <textarea name="comentário" cols="40" rows="5"></textarea> 
                    <br>
                </td>
            </tr>
            <tr>
                <td>Matéria de Interesse:
                    <br>
                    <input type="checkbox" name="auto" value="auto">Backend
                    <br>
                    <input type="checkbox" name="auto" value="auto">Frontend
                    <br>
                    <input type="checkbox" name="auto" value="auto">Fullstack
                </td>
                <td>Tipo de Viagem:
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="negócios">Negócios
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="lazer">Lazer
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="turismo">Turismo
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="acadêmico">Acadêmico
                    <br>
                </td>


            </tr>
        </tbody>

    </table>
    </form>


    
</body>
</html>
