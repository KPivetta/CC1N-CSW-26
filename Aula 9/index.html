<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula-9</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
    <table border="1">
        <tbody>
            <tr>
                <td>Nome:</td>
                <td>
                    <label for="Nome"></label>
                    <input type="text" id="Nome" name="nome" size="40" maxlength="30" placeholder="Digite seu nome">
                </td>
            </tr>
            <tr>
                <td>E-mail pessoal:</td>
                <td>
                <input type="text" id="E-mail" name="E-mail" size="40" maxlength="30">
                </td>
            </tr>
            <tr>
                <td>E-mail (patter):</td>
                <td>
                <input type="text" id="E-mail" name="E-mail" size="40" maxlength="30" placeholder="Digite seu email com @">
                </td>
            </tr>
            <tr>
                <td>Senha:</td>
                <td>
                    <input type="text" id="Senha" name="Senha" size="40" maxlength="30">
                </td>
            </tr>
            <tr>
                <td>Idade:</td>
                <td>
                    <input type="text" id="Senha" name="Senha" size="5" maxlength="30">
                </td>
            </tr>
            <tr>
                <td colspan="2">Deixe um comentário: <br>
                    <textarea name="comentário" cols="40" rows="5"></textarea> 
                    <br>
                </td>
            </tr>
            <tr>
                <td>Matéria de Interesse:
                    <br>
                    <input type="checkbox" name="auto" value="auto">Backend
                    <br>
                    <input type="checkbox" name="auto" value="auto">Frontend
                    <br>
                    <input type="checkbox" name="auto" value="auto">Fullstack
                </td>
                <td>Tipo de Viagem:
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="negócios">Negócios
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="lazer">Lazer
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="turismo">Turismo
                    <br>
                    <input type="radio" id="opçao" name="opçao" value="acadêmico">Acadêmico
                    <br>
                </td>
            </tr>
            <td>
                    <label for="">Esporte favorito:</label>
                    <select name="esportes" id="esportes" size="4">
                        <option value="futebol">Futebol</option>
                        <option value="Basquete">Basquete</option>
                        <option value="vôlei">Vôlei</option>
                        <option value="tênis">Tênis</option>
                        <option value="">Selecione</option>
                    </select>
                </td>
                <td>
                    <label for="">Investimentos</label>
                    <select name="investimentos" id="investimentos" size="1">

                        <optgroup label="Alto Risco">
                            <option value="investimento_1">Poupança</option>
                            <option value="investimento_2">CDB</option>
                            <option value="investimento_3">Tesouro Direto</option>
                        </optgroup>

                        <optgroup label="Médio Risco">
                            <option value="investimento_4">Fundos Imobiliários</option>
                            <option value="investimento_5">CDI</option>
                            <option value="investimento_6">Debêntures</option>
                        </optgroup>

                        <optgroup label="Baixo Risco">
                            <option value="investimento_7">Criptomoedas</option>
                            <option value="investimento_8">Ações</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">Data e Hora envio: 
                    <input type="datetime-local" name="dtl" id="dtl">
                </td>
            </tr>
            <tr>
                <td>

                </td>
                <td>
                    
                </td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Enviar">
                </td>
                <td>
                    <input type="reset" value="Limpar">
                </td>
            </tr>
        </tbody>
    </table>
    </form>
    
</body>
</html>
